name: Deploy FantasAIFootball

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check trigger source
        run: echo "Triggered by ${{ github.event_name }} on branch ${{ github.ref_name }}"

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH }}

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no nolan@${{ secrets.EC2_PUBLIC_IP }} "echo Hello World"

      - name: Build FantasAIFootball
        run: |
          dotnet build FantasAIFootball.csproj

      - name: Build Stats Dashboard
        run: |
          dotnet build StatsDashboard/StatsDashboard.csproj

      - name: Restore for Linux Runtime
        run: |
          dotnet restore FantasAIFootball.csproj --runtime linux-x64
          dotnet restore StatsDashboard/StatsDashboard.csproj --runtime linux-x64

      - name: Publish FantasAIFootball
        run: |
          dotnet publish FantasAIFootball.csproj -c Release -r linux-x64 --self-contained true -o ./publish

      - name: Publish Stats Dashboard
        run: |
          dotnet publish StatsDashboard/StatsDashboard.csproj -c Release -r linux-x64 --self-contained true -o ./dashboard-publish

      - name: Deploy FantasAIFootball to EC2
        run: |
          rsync -avzO --no-perms --delete --exclude='/dashboard/' ./publish/ nolan@${{ secrets.EC2_PUBLIC_IP }}:/opt/FantasAIFootball/

      - name: Deploy Stats Dashboard to EC2
        run: |
          ssh nolan@${{ secrets.EC2_PUBLIC_IP }} 'mkdir -p /opt/FantasAIFootball/dashboard'
          rsync -avzO --no-perms --delete ./dashboard-publish/ nolan@${{ secrets.EC2_PUBLIC_IP }}:/opt/FantasAIFootball/dashboard/

      - name: Restart Stats Dashboard and Caddy
        run: |
          ssh nolan@${{ secrets.EC2_PUBLIC_IP }} '
            set -e
            chmod +x /opt/FantasAIFootball/dashboard/StatsDashboard
            sudo -n systemctl restart fantasaifootball-dashboard.service
            sudo -n systemctl restart caddy
          '
